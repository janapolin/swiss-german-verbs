<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Züritüütsch Verb Trainer{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block nav %}
  <nav class="bottom-nav">
    <a href="/practice" class="nav-item {{ 'active' if request.url.path.startswith('/practice') else '' }}">
      <span class="nav-icon">▶</span><span>Practice</span>
    </a>
    <a href="/verbs" class="nav-item {{ 'active' if request.url.path.startswith('/verbs') else '' }}">
      <span class="nav-icon">📖</span><span>Verbs</span>
    </a>
    <a href="/settings" class="nav-item {{ 'active' if request.url.path.startswith('/settings') or request.url.path.startswith('/profiles') else '' }}">
      <span class="nav-icon">⚙</span><span>Settings</span>
    </a>
  </nav>
  {% endblock %}
</body>
</html>
